<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Previous Papers | SRKP AI</title>

<link rel="stylesheet" href="style.css">

<style>

.papers-page {
    max-width:1200px;
    margin:auto;
    padding:70px 5%;
}

.papers-hero {
    text-align:center;
    max-width:800px;
    margin:auto;
}

.papers-hero h1 {
    font-size:55px;
    margin:20px 0;
}

.papers-hero h1 span {
    color:#9d8aff;
}

.papers-hero p {
    color:#9da6bb;
    line-height:1.7;
}

.paper-controls {
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    margin:40px 0;
}

.paper-controls input,
.paper-controls select {
    padding:14px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.1);
    background:#101424;
    color:white;
}

.paper-list {
    display:grid;
    gap:15px;
}

.paper-card {
    padding:22px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.paper-icon {
    font-size:35px;
}

.paper-info h3 {
    margin-bottom:7px;
}

.paper-info p {
    color:#909bb0;
    font-size:13px;
}

.paper-button {
    padding:10px 15px;
    border-radius:9px;
    background:#6852e8;
    color:white;
    border:0;
    cursor:pointer;
}

@media(max-width:750px) {

    .paper-controls {
        grid-template-columns:1fr;
    }

    .papers-hero h1 {
        font-size:42px;
    }

    .paper-card {
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">

<div class="logo-box">S</div>

<div>
<h2>SRKP AI</h2>
<span>Study Assistant</span>
</div>

</div>

<nav id="navigation">

<a href="index.html">Home</a>
<a href="tutor.html">AI Tutor</a>
<a href="syllabus.html">Syllabus</a>
<a href="notes.html">Notes</a>
<a href="papers.html" class="active">Papers</a>

</nav>

<button
class="menu-button"
onclick="toggleMenu()">
☰
</button>

</header>


<main class="papers-page">

<section class="papers-hero">

<div class="college-badge">
📄 Exam Preparation
</div>

<h1>
Previous
<span>Papers</span>
</h1>

<p>
Browse practice and previous-paper records
by course, semester and subject.
</p>

</section>


<div class="paper-controls">

<select id="paperCourse">

<option value="all">All Courses</option>
<option>BA</option>
<option>BSc</option>
<option>BCom</option>
<option>MA</option>
<option>MSc</option>
<option>MCom</option>

</select>


<select id="paperSemester">

<option value="all">All Semesters</option>
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
<option>Semester 5</option>
<option>Semester 6</option>

</select>


<input
id="paperSearch"
placeholder="Search subject or paper..."
>

</div>


<div
id="paperList"
class="paper-list">
</div>

</main>


<footer>

<div class="copyright">

© 2026 SRKP AI Study Assistant

<br>

Designed & Developed by
<strong>Anish Jodhawat</strong>

</div>

</footer>


<script src="script.js"></script>
<script src="papers.js"></script>

</body>

</html>
